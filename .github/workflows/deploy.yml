name: Test and publish English Quest
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DASH__SUPPRESS_ANALYTICS: 'true'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: python3 tools/build_course.py
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build for GitHub Pages subdirectory
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/" --no-web-resources-cdn
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
