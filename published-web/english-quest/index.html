<!DOCTYPE html>
<html lang="en"><head><base href="/english-quest/"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#176B59"><meta name="description" content="A 100-day Hindi-to-English adventure. 200 sentence pairs every day, quizzes, listening, and streak rewards."><title>English Quest · 100 days</title>
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="English Quest"><meta name="application-name" content="English Quest">
<style>body{margin:0;background:#f7f8f2;font-family:Arial;color:#173e35}#loading{display:grid;place-content:center;height:100vh;text-align:center}
#eq-sheet{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(23,62,53,.45);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#173e35}
#eq-sheet.show{display:flex}
#eq-card{box-sizing:border-box;width:100%;max-width:460px;margin:0 12px calc(12px + env(safe-area-inset-bottom));background:#fff;border-radius:22px;padding:20px 20px 16px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#eq-card header{display:flex;align-items:center;gap:12px;margin-bottom:12px}#eq-card header img{width:48px;height:48px;border-radius:12px}
#eq-card h2{margin:0;font-size:18px}#eq-card header p{margin:2px 0 0;color:#5a6f68;font-size:13px}
#eq-steps{margin:0 0 16px;padding-left:22px}#eq-steps li{margin:6px 0}#eq-steps b{color:#176b59}
#eq-card .row{display:flex;gap:10px;justify-content:flex-end}
#eq-card button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:10px 18px;cursor:pointer}
#eq-copy{background:#e3efe9;color:#176b59;display:none}#eq-close{background:#176b59;color:#fff}
.eq-ic{display:inline-block;vertical-align:-3px;width:18px;height:18px}</style></head><body><div id="loading"><h1>English Quest</h1><p>Your next adventure starts with a sentence.</p><p>Loading your learning trail…</p></div>
<div id="eq-sheet" role="dialog" aria-modal="true" aria-labelledby="eq-title"><div id="eq-card"><header><img src="icons/Icon-192.png" alt=""><div><h2 id="eq-title">Install English Quest</h2><p>Get the app icon on your home screen. Works offline.</p></div></header><ol id="eq-steps"></ol><div class="row"><button id="eq-copy" type="button">Copy link</button><button id="eq-close" type="button">OK</button></div></div></div>
<script src="flutter_bootstrap.js" async></script>
<script>
(function () {
  // Offline support: register our service worker, then hand it the list of files
  // this visit loaded so the app also works without a connection next time.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; }).then(function (reg) {
        setTimeout(function () {
          var urls = performance.getEntriesByType('resource').map(function (e) { return e.name; });
          if (reg.active) reg.active.postMessage({ type: 'cache-urls', urls: urls.concat([location.href]) });
        }, 8000);
      }).catch(function (e) { console.warn('Service worker registration failed', e); });
    });
  }

  // Install helper, called by the app's Install button (lib/install_web.dart).
  // Uses the browser's own install prompt when it offers one; otherwise shows
  // the steps for this phone and browser.
  var deferred = null, installed = false;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; });
  window.addEventListener('appinstalled', function () { installed = true; deferred = null; close(); });

  function standalone() {
    return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  }
  var share = '<svg class="eq-ic" viewBox="0 0 24 24" fill="none" stroke="#176b59" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
  var dots = '<b>⋮</b>';

  function steps() {
    var ua = navigator.userAgent;
    var ios = /iPhone|iPad|iPod/.test(ua) || (ua.indexOf('Macintosh') > -1 && navigator.maxTouchPoints > 1);
    var android = /Android/i.test(ua);
    var inApp = /FBAN|FBAV|FB_IAB|Instagram|Line\/|Snapchat|Twitter|LinkedInApp|GSA\/|; wv\)/i.test(ua);
    if (ios && (inApp || /CriOS|FxiOS|EdgiOS|OPiOS/.test(ua))) return { copy: true, list: [
      'Copy the link below and open it in <b>Safari</b>. iPhone only installs apps from Safari.',
      'In Safari, tap the <b>Share</b> button ' + share + ' at the bottom.',
      'Scroll down and tap <b>Add to Home Screen</b>, then <b>Add</b>.' ] };
    if (ios) return { list: [
      'Tap the <b>Share</b> button ' + share + ' at the bottom of Safari.',
      'Scroll down and tap <b>Add to Home Screen</b>.',
      'Tap <b>Add</b>. The English Quest icon appears on your home screen.' ] };
    if (android && inApp) return { copy: true, list: [
      'This page is open inside another app. Tap ' + dots + ' and choose <b>Open in Chrome</b> (or copy the link and paste it into Chrome).',
      'In Chrome, tap ' + dots + ' at the top right.',
      'Tap <b>Install app</b> or <b>Add to Home screen</b>, then <b>Install</b>.' ] };
    if (android) return { list: [
      'Tap the browser menu ' + dots + ' at the top right (bottom in Samsung Internet).',
      'Tap <b>Install app</b> or <b>Add to Home screen</b>.',
      'Tap <b>Install</b>. The English Quest icon appears on your home screen.' ] };
    return { list: [
      'In Chrome or Edge, click the <b>install icon</b> at the right of the address bar,',
      'or open the browser menu and choose <b>Install English Quest</b> / <b>Apps → Install this site as an app</b>.' ] };
  }

  var sheet = document.getElementById('eq-sheet'), copyBtn = document.getElementById('eq-copy');
  function close() { sheet.classList.remove('show'); }
  document.getElementById('eq-close').addEventListener('click', close);
  sheet.addEventListener('click', function (e) { if (e.target === sheet) close(); });
  copyBtn.addEventListener('click', function () {
    var url = location.href.split('?')[0].split('#')[0];
    function done() { copyBtn.textContent = 'Copied ✓'; }
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, function () { prompt('Copy this link:', url); });
    else prompt('Copy this link:', url);
  });

  function showSteps() {
    var s = steps();
    document.getElementById('eq-steps').innerHTML = s.list.map(function (t) { return '<li>' + t + '</li>'; }).join('');
    copyBtn.style.display = s.copy ? 'inline-block' : 'none';
    copyBtn.textContent = 'Copy link';
    sheet.classList.add('show');
  }

  // true when the Install button should be shown (not already running as the installed app).
  window.eqInstallAvailable = function () { return !installed && !standalone(); };
  window.eqInstallOpen = function () {
    if (deferred) {
      var e = deferred; deferred = null;
      e.prompt();
      e.userChoice.then(function (c) { if (c.outcome !== 'accepted') deferred = null; }).catch(function () {});
      return;
    }
    showSteps();
  };
})();
</script></body></html>
